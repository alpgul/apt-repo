name: 🔄 Auto Update APT Repo

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update (even if version hasn't changed)"
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. CHECKOUT
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. INSTALL TOOLS
      - name: 🛠️ Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg2 curl

      # 3. IMPORT GPG KEY
      - name: 🔐 Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      # 4. VERSION CHECK
      - name: 🔍 Check Latest Docker Desktop Version
        id: version_check
        run: |
          APPCAST=$(curl -sfL "https://desktop.docker.com/linux/main/amd64/appcast.xml")
          LATEST_VERSION=$(echo "$APPCAST" | grep -oP '(?<=sparkle:shortVersionString=")[^"]+' | head -1 || echo "")
          DEB_URL=$(echo "$APPCAST" | grep -oP 'url="[^"]+\.deb"' | head -1 | grep -oP '(?<=url=")[^"]+')

          if [ -z "$LATEST_VERSION" ] || [ -z "$DEB_URL" ]; then
            echo "❌ Version or URL could not be detected!"
            exit 1
          fi

          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "deb_url=$DEB_URL"               >> $GITHUB_OUTPUT
          
          CURRENT_VERSION=""
          [ -f "VERSION" ] && CURRENT_VERSION=$(head -1 VERSION)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      # 5. PREPARE WORKING DIRECTORY
      - name: 📁 Prepare Working Directory
        if: steps.version_check.outputs.needs_update == 'true'
        run: mkdir -p /tmp/release

      # 6. DOWNLOAD .DEB
      - name: 📦 Download .deb
        if: steps.version_check.outputs.needs_update == 'true'
        id: deb_meta
        env:
          DEB_URL: ${{ steps.version_check.outputs.deb_url }}
        run: |
          DEB_FILE="/tmp/release/docker-desktop-amd64.deb"
          curl -fL "$DEB_URL" -o "$DEB_FILE"
      
      # 7. CREATE PACKAGES FILE
      - name: 📝 Create Packages File
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          cd /tmp/release
          apt-ftparchive packages . > Packages
          gzip -9 -kf Packages
          xz -9 -kf Packages

      # 8. CREATE AND SIGN RELEASE
      - name: 🔏 Create and Sign Release
        if: steps.version_check.outputs.needs_update == 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          VERSION: ${{ steps.version_check.outputs.latest_version }}
        run: |
          cd /tmp/release
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="MyRepo" \
            -o APT::FTPArchive::Release::Label="MyRepo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Docker Desktop $VERSION APT Repo" \
            release . > Release

          gpg --batch --pinentry-mode loopback --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          gpg --batch --pinentry-mode loopback --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

      # 9. ADD PUBLIC KEY
      - name: 🔑 Add Public Key
        if: steps.version_check.outputs.needs_update == 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: gpg --export -a "$GPG_KEY_ID" > /tmp/release/public.key
        
      # 10. UPDATE VERSION AND CHANGELOG
      - name: 📌 Update VERSION and CHANGELOG
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.latest_version }}"
          echo "$VERSION" > VERSION
          {
            echo "## $VERSION — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Updated Docker Desktop to $VERSION"
            echo ""
            cat CHANGELOG.md 2>/dev/null || true
          } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "🔄 Update Docker Desktop to $VERSION"
          git push origin main

      # 11. CREATE GITHUB RELEASE (FIXED TO PREVENT DRAFT)
      - name: 🚀 Create GitHub Release
        if: steps.version_check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_check.outputs.latest_version }}
        run: |
          # Eski sürümü ve tag'i tamamen temizle
          gh release delete "apt-repo" --yes 2>/dev/null || true
          git push origin :refs/tags/apt-repo 2>/dev/null || true
          
          # 1 saniye bekle (API senkronizasyonu için)
          sleep 1

          # Yeni sürümü doğrudan yayınla (Draft olmaması için --latest=true ve --prerelease=false)
          gh release create "apt-repo" \
            --title "APT Repo — Docker Desktop $VERSION" \
            --notes "Docker Desktop $VERSION APT repository files." \
            --target main \
            --latest=true \
            --prerelease=false

          # Dosyaları yükle
          gh release upload "apt-repo" \
            /tmp/release/docker-desktop-amd64.deb \
            /tmp/release/Packages \
            /tmp/release/Packages.gz \
            /tmp/release/Packages.xz \
            /tmp/release/Release \
            /tmp/release/Release.gpg \
            /tmp/release/InRelease \
            /tmp/release/public.key \
            --clobber



      # 12. SUMMARY
      - name: 📊 Summary
        if: always()
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/apt-repo"
          echo "## 📊 APT Repo Update Report" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📌 Old Version | ${{ steps.version_check.outputs.current_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 New Version | ${{ steps.version_check.outputs.latest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Updated | ${{ steps.version_check.outputs.needs_update }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📡 Base URL | \`$BASE_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APT Source" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/myrepo.asc] $BASE_URL ./" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
